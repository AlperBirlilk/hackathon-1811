spring.application.name=portal-backend
server.port=8080

# DuckDB (data/ dir is created in PortalApplication.main)
spring.datasource.url=jdbc:duckdb:./data/portal.duckdb
spring.datasource.driver-class-name=org.duckdb.DuckDBDriver
spring.datasource.hikari.maximum-pool-size=4

# schema.sql + data.sql run on every start (both idempotent)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Shared with Django (HS256, >= 32 bytes) and Django -> Java service key
portal.jwt.secret=${PORTAL_JWT_SECRET:dev-only-change-me-dev-only-change-me-32b}
portal.service-key=${PORTAL_SERVICE_KEY:dev-service-key}

spring.jackson.default-property-inclusion=always
