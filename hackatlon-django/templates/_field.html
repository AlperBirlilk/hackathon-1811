<div class="field{% if full %} full{% endif %}" data-field="{{ field.name }}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  <div class="err" data-error-for="{{ field.name }}">{% for e in field.errors %}{{ e }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</div>
</div>
